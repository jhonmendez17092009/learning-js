<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Punto 3</title>
</head>
<body>
    <h1>Mostrar un texto</h1>

    <input type="text" id="idtexto">
    <button onclick="mostrar()">Mostrar texto</button>

    <div id="resultado"></div>

    <script>
        function mostrar() {
            texto = document.getElementById("idtexto").value;
            document.getElementById("resultado").innerHTML = texto;
        }
    </script>
</body>
</html>
